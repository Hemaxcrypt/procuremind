<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProcureMind</title>
  <meta name="description" content="A procurement agent that remembers every supplier and recommends who to buy from.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%231F2C52'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%23FFF3BF' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">ProcureMind</span>
      <span class="sim-tag" title="All suppliers, quotes and history in this demo are invented">Simulated data</span>
    </div>
    <nav class="tabs" aria-label="Main">
      <a href="#compare" data-tab="compare">Compare quotes</a>
      <a href="#orders" data-tab="orders">Open orders <span class="count" id="order-count"></span></a>
      <a href="#suppliers" data-tab="suppliers">Suppliers</a>
    </nav>
    <button class="btn-quiet" id="reset">Reset demo</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
